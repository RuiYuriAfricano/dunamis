services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dunamis
      POSTGRES_PASSWORD: dunamis
      POSTGRES_DB: dunamis
    ports:
      - "5432:5432"
    volumes:
      - dunamis_postgres_data:/var/lib/postgresql/data

volumes:
  dunamis_postgres_data:
